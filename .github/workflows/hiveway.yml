name: Hiveway
on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "apps/hiveway/**"
      - "apps/nectar/**"
      - "packages/**"
      - "scripts/**"
      - "docker/**"
      - "*.toml"
      - "*.json"
      - "*.yaml"
      - "*.lock"
      - "*.nix"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hiveway-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_DB: hive
          POSTGRES_USER: hive
          POSTGRES_PASSWORD: hive-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hive -d hive" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8.10.3-trixie@sha256:298641b35ac51aa999f9bb85707d6681fe635ce59cda51886a0b6adc1da37b8e
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CI: "true"
      DATABASE_URL: postgres://hive:hive-ci-only@127.0.0.1:5432/hive
      HIVE_TEST_DATABASE_URL: postgres://hive:hive-ci-only@127.0.0.1:5432/hive
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Install development environment
        run: nix profile install nixpkgs#devenv
      - name: Install JavaScript dependencies
        run: devenv shell -- bun install --frozen-lockfile
      - name: Lint and format
        run: devenv shell -- bun run check --ci
      - name: Types, dependency audit and isolated Miri
        run: devenv shell -- bun run check-types --ci
      - name: Nectar contract tests and production build
        run: |
          devenv shell -- bun test scripts/tests
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          devenv shell -- bun --cwd apps/nectar next build
      - name: PostgreSQL and security integration tests
        run: devenv shell -- cargo test --locked --workspace --all-targets --all-features -- --include-ignored
      - name: Start isolated payment infrastructure
        run: devenv shell -- bun packages/local/src/chain/start.ts
      - name: Exercise independent creator and buyer agents
        env:
          HIVE_DEMO_REPOSITORY: https://github.com/${{ github.repository }}
        shell: bash
        run: |
          devenv shell -- bun packages/local/src/agents/serve.ts > .hive/local/backend.log 2>&1 &
          backend_pid=$!
          trap 'kill -TERM "$backend_pid" 2>/dev/null || true' EXIT
          for _attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/api/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/api/ready
          HIVE_DEMO_REVISION="$GITHUB_SHA" devenv shell -- bun packages/local/src/agents/demo.ts
          devenv shell -- bun packages/local/src/agents/hosted-demo.ts
          devenv shell -- bun packages/local/src/agents/mcp-demo.ts
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose --profile payments logs --tail 100
          test ! -f .hive/local/backend.log || tail -100 .hive/local/backend.log
      - name: Stop isolated payment infrastructure
        if: always()
        run: docker compose --profile payments down

  publish-nectar:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      app: nectar
  publish-hiveway:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      app: hiveway
  deploy:
    needs: [publish-nectar, publish-hiveway]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment:
      name: hive
      url: https://hive.itssingularity.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy immutable release and verify health
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_HIVEWAY_ID: ${{ vars.DOKPLOY_HIVEWAY_ID }}
          DOKPLOY_NECTAR_ID: ${{ vars.DOKPLOY_NECTAR_ID }}
          HIVEWAY_IMAGE: ${{ needs.publish-hiveway.outputs.image }}
          NECTAR_IMAGE: ${{ needs.publish-nectar.outputs.image }}
          HIVEWAY_PUBLIC_URL: ${{ vars.HIVEWAY_PUBLIC_URL }}
          NECTAR_PUBLIC_URL: ${{ vars.NECTAR_PUBLIC_URL }}
          RELEASE_REVISION: ${{ github.sha }}
        run: python3 scripts/deploy.py
