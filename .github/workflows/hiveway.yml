name: Hiveway
on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "apps/hiveway/**"
      - "apps/nectar/**"
      - "packages/**"
      - "scripts/**"
      - "docker/**"
      - "*.toml"
      - "*.json"
      - "*.yaml"
      - "*.lock"
      - "*.nix"
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hiveway-${{ github.ref }}
  # Do not interrupt a release after publishing images or starting deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  # Use the default single pending slot: newer commits replace queued older ones.
env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  # Keep caches small; fresh runners cannot reuse incremental compiler state.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  javascript:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-javascript
      - name: JavaScript lint, formatting and workspace consistency
        run: |
          bunx --no-install oxlint --deny-warnings .
          bunx --no-install oxfmt --check .
          bunx --no-install sherif --fail-on-warnings
      - name: TypeScript
        run: bun scripts/verify.ts nectar check-types
      - name: Contract tests
        run: bun test scripts/tests
      - name: Cache Next.js compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/nectar/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-v1-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-next-v1-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-next-v1-
      - name: Nectar production build
        run: bun --cwd apps/nectar next build

  rust-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Rust format and Clippy (includes type checking)
        run: |
          devenv shell -- cargo fmt --all --check
          devenv shell -- cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Fresh dependency audit and unused dependencies
        run: |
          devenv shell -- cargo deny --locked check
          devenv shell -- cargo machete --with-metadata

  miri:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Isolated Miri
        run: |
          devenv shell -- cargo miri setup
          devenv shell -- cargo miri test --locked --workspace --all-features

  integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_DB: hive
          POSTGRES_USER: hive
          POSTGRES_PASSWORD: hive-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hive -d hive" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8.10.3-trixie@sha256:298641b35ac51aa999f9bb85707d6681fe635ce59cda51886a0b6adc1da37b8e
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CI: "true"
      DATABASE_URL: postgres://hive:hive-ci-only@127.0.0.1:5432/hive
      HIVE_TEST_DATABASE_URL: postgres://hive:hive-ci-only@127.0.0.1:5432/hive
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-javascript
      - name: PostgreSQL and security integration tests
        run: devenv shell -- cargo test --locked --workspace --all-targets --all-features -- --include-ignored
      - name: Start isolated payment infrastructure
        run: devenv shell -- bun packages/local/src/chain/start.ts
      - name: Exercise independent creator and buyer agents
        env:
          HIVE_DEMO_REPOSITORY: https://github.com/${{ github.repository }}
        shell: bash
        run: |
          devenv shell -- bun packages/local/src/agents/serve.ts > .hive/local/backend.log 2>&1 &
          backend_pid=$!
          trap 'kill -TERM "$backend_pid" 2>/dev/null || true' EXIT
          for _attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/api/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/api/ready
          HIVE_DEMO_REVISION="$GITHUB_SHA" devenv shell -- bun packages/local/src/agents/demo.ts
          devenv shell -- bun packages/local/src/agents/hosted-demo.ts
          devenv shell -- bun packages/local/src/agents/mcp-demo.ts
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose --profile payments logs --tail 100
          test ! -f .hive/local/backend.log || tail -100 .hive/local/backend.log
      - name: Stop isolated payment infrastructure
        if: always()
        run: docker compose --profile payments down

  validate:
    needs: [javascript, rust-check, miri, integration]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          ALL_PASSED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: test "$ALL_PASSED" = "true"

  publish-nectar:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      app: nectar
  publish-hiveway:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      app: hiveway
  deploy:
    needs: [publish-nectar, publish-hiveway]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment:
      name: hive
      url: https://hive.itssingularity.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Deploy immutable release and verify health
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_HIVEWAY_ID: ${{ vars.DOKPLOY_HIVEWAY_ID }}
          DOKPLOY_NECTAR_ID: ${{ vars.DOKPLOY_NECTAR_ID }}
          HIVEWAY_IMAGE: ${{ needs.publish-hiveway.outputs.image }}
          NECTAR_IMAGE: ${{ needs.publish-nectar.outputs.image }}
          HIVEWAY_PUBLIC_URL: ${{ vars.HIVEWAY_PUBLIC_URL }}
          NECTAR_PUBLIC_URL: ${{ vars.NECTAR_PUBLIC_URL }}
          RELEASE_REVISION: ${{ github.sha }}
        run: bun scripts/deploy.ts
