name: hive

services:
  postgres:
    image: hive-postgres:development
    build:
      context: ./docker
      target: postgres
    environment:
      POSTGRES_DB: hive
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hive-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: hive-redis:development
    build:
      context: ./docker
      target: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.1.2
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-hive@localhost.test}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-Hive-local-only-123!}
      ZO_DATA_DIR: /data
      ZO_TELEMETRY: "false"
      ZO_COMPACT_DATA_RETENTION_DAYS: "7"
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - openobserve-data:/data

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.7@sha256:6fec6dc8249fb0231144b159e4ee1d86e486e3dc8eccb09a25e5e16ce494236b
    profiles: [payments]
    entrypoint: [anvil]
    command:
      [
        "--host",
        "0.0.0.0",
        "--chain-id",
        "31337",
        "--block-time",
        "1",
        "--silent",
      ]
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 3s
      retries: 30

  facilitator:
    profiles: [payments]
    build:
      context: .
      dockerfile: docker/payments/Dockerfile
    environment:
      HIVE_LOCAL_RPC_URL: http://anvil:8545
      HIVE_FACILITATOR_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4022:4022"
    depends_on:
      anvil:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:4022/supported').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  postgres-data:
  redis-data:
  openobserve-data:
