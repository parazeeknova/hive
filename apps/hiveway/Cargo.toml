[package]
name = "hiveway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "^1.0.104"
axum = { version = "^0.8.9", default-features = false, features = [
  "http1",
  "query",
  "tokio",
  "json",
] }
fred = { version = "^10.1.0", default-features = false, features = [
  "i-keys",
  "enable-rustls",
  "partial-tracing",
] }
opentelemetry = { version = "^0.33.1", default-features = false, features = [
  "trace",
  "logs",
] }
opentelemetry-appender-tracing = "^0.33.1"
opentelemetry-otlp = { version = "^0.33.1", default-features = false, features = [
  "http-proto",
  "reqwest-blocking-client",
  "reqwest-rustls",
  "trace",
  "logs",
] }
opentelemetry_sdk = { version = "^0.33.1", default-features = false, features = [
  "trace",
  "logs",
] }
reqwest = { version = "^0.13.5", default-features = false, features = [
  "json",
  "rustls",
] }
rig-core = { version = "^0.45.0", default-features = false, features = [
  "reqwest",
  "rustls",
] }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
sea-orm = { version = "^2.0.4", default-features = false, features = [
  "macros",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "with-json",
  "with-uuid",
  "postgres-array",
] }
sea-orm-migration = { version = "^2.0.4", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }
thiserror = "^2.0.21"
tokio = { version = "^1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
] }
tower = { version = "^0.5.3", features = ["util"] }
tower-http = { version = "^0.7.1", features = ["trace", "cors"] }
tracing = "^0.1.44"
tracing-opentelemetry = { version = "^0.34.0", default-features = false }
tracing-subscriber = { version = "^0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "^6.0.0", features = ["axum_extras", "uuid"] }

base64 = "^0.23.1"
hex = "^0.4.3"
rand = "^0.10.3"
standardwebhooks = "^1.0.1"
sha2 = "^0.11.1"
sha3 = "^0.11.0"
time = { version = "^0.3.55", features = ["formatting", "parsing"] }
toml = "^1.1.8"
uuid = { version = "^1.29.0", features = ["v4", "serde"] }

k256 = { version = "^0.14.0", features = ["ecdsa"] }

[lints]
workspace = true
