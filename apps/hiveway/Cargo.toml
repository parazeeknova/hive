[package]
name = "hiveway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "^1.0.104"
axum = { version = "^0.8.9", default-features = false, features = [
  "http1",
  "tokio",
  "json",
] }
fred = { version = "^10.1.0", default-features = false, features = [
  "i-keys",
  "enable-rustls",
  "partial-tracing",
] }
opentelemetry = { version = "^0.33.1", default-features = false, features = [
  "trace",
  "logs",
] }
opentelemetry-appender-tracing = "^0.33.1"
opentelemetry-otlp = { version = "^0.33.1", default-features = false, features = [
  "http-proto",
  "reqwest-blocking-client",
  "reqwest-rustls",
  "trace",
  "logs",
] }
opentelemetry_sdk = { version = "^0.33.1", default-features = false, features = [
  "trace",
  "logs",
] }
reqwest = { version = "^0.13.5", default-features = false, features = [
  "json",
  "rustls",
] }
rig-core = { version = "^0.45.0", default-features = false, features = [
  "reqwest",
  "rustls",
] }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
sqlx = { version = "^0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "json",
  "migrate",
  "macros",
] }
thiserror = "^2.0.21"
tokio = { version = "^1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
] }
tower = { version = "^0.5.3", features = ["util"] }
tower-http = { version = "^0.7.1", features = ["trace"] }
tracing = "^0.1.44"
tracing-opentelemetry = { version = "^0.34.0", default-features = false }
tracing-subscriber = { version = "^0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "^6.0.0", features = ["axum_extras"] }

[lints]
workspace = true
