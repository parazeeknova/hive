# Public operational defaults. Override this file with HIVE_CONFIG_FILE, and URLs
# or secrets with environment variables. Changes take effect on process restart.
listen_address = "127.0.0.1:3001"
public_url = "http://127.0.0.1:3001"
auth_origin = "http://127.0.0.1:3000"
facilitator_url = "https://x402.org/facilitator"
rpc_url = "https://sepolia.base.org"
dodo_api_url = "https://test.dodopayments.com"

[http]
concurrency = 32
requests_per_minute = 120
