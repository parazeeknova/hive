[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "BSD-2-Clause",
  "Zlib",
  "Apache-2.0 WITH LLVM-exception",
  "CDLA-Permissive-2.0",
]

[bans]
# Independent SDKs may require different transitive major versions.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
